android.nonFinalResIds=false
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=36
android.suppressSdkVersionWarning=true
org.gradle.caching=false

# JVM Memory Settings for Gradle 9 compatibility
org.gradle.jvmargs=-Xmx2g -Xms1g -XX:MaxMetaspaceSize=512m
org.gradle.daemon.performance.disable-logging=true

# Gradle optimization settings
org.gradle.parallel=true

# Modern configuration cache settings (Gradle 9 compatibility)
# org.gradle.configuration-cache=true

# Additional Gradle 9 compatibility settings
org.gradle.warning.mode=all

# Disable Build Analyzer to resolve AGP deprecation warning
android.enableBuildAnalyzer=false